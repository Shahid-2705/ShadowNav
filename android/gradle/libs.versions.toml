[versions]
agp = "8.7.3"
# Bumped from 2.0.21 (blueprint Step 3): MapLibre Android SDK 13.6.0 ships
# Kotlin metadata requiring 2.2.0+ ("Module was compiled with an incompatible
# version of Kotlin" otherwise). 2.4.0 is current stable as of 2026-09-05.
kotlin = "2.4.0"
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
lifecycle = "2.8.7"
junit = "4.13.2"
# Confirmed live on Maven Central 2026-09-05 (search-first, per blueprint Step 1
# task 1). Filament moves fast -- re-check before bumping, don't assume stale.
filament = "1.75.1"
# Confirmed live on Maven Central 2026-09-05 (search-first, blueprint Step 3).
# Not Mapbox GL (paid) or the Google Maps SDK (billing-gated) -- MapLibre is
# open-source with no per-request vendor gate, matching the same
# anti-vendor-gate positioning as the Filament-over-SceneView choice in
# Step 1 (PLAN.md §1's own pitch against Baidu's SDK-gated VDR).
maplibre = "13.6.0"
# ONNX Runtime for the on-device speed net (shared/speednet.onnx, opset 17).
# Confirmed live on Maven Central 2026-09-10 (maven-metadata.xml lists 1.29.0
# as the newest release). Chosen over TFLite because the trained model is
# PyTorch and `torch.onnx.export` reproduces it to 2e-6 (scripts/export_onnx.py),
# and over NNAPI because NNAPI is deprecated from Android 15; the default
# CPU provider on this package is XNNPACK-backed. Loaded behind
# SpeedNetOnnx.USE_SPEED_NET = false until a device number exists.
onnxruntime = "1.29.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Raw Filament, not SceneView: SceneView's current 4.x line is Compose-native
# and pulls in the whole Compose runtime, which this project deliberately has
# never added (see Ui.kt's file comment). Filament is a plain SurfaceView/
# TextureView API. See plans/shadownav-3d-mvp-web-deck.md Step 1 and its
# anti-patterns section for the full decision record.
filament-android = { group = "com.google.android.filament", name = "filament-android", version.ref = "filament" }
# Runtime material compiler (Google's own MaterialBuilder API) -- lets us
# compile a simple UNLIT material on-device with plain Kotlin, with zero
# dependency on the `matc` build-time toolchain (which requires building
# Filament's own C++ project from source and is impractical here). See
# google/filament's sample-material-builder for the reference usage this
# project's OrbMaterial.kt is based on.
filamat-android = { group = "com.google.android.filament", name = "filamat-android", version.ref = "filament" }
maplibre-android-sdk = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
