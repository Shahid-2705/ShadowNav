[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadownav"
version = "0.1.0"
description = "Smartphone-only vehicle dead reckoning through GNSS blackouts (SIH26168)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = ["torch>=2.0"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8.0", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
include = ["shadownav*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "realdata: requires the IO-VNBD download (skipped when data/ is absent)",
]

[tool.coverage.run]
source = ["shadownav"]
omit = ["*/tests/*"]
